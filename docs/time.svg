<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Час T(p)">
<style>
  .surface { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .sub { fill: #52514e; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tick { fill: #898781; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .axis-title { fill: #52514e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .label { fill: #0b0b0b; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .base { stroke: #c3c2b7; stroke-width: 1; }
  .ideal { stroke: #898781; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  .cores { stroke: #c3c2b7; stroke-width: 1; stroke-dasharray: 2 3; }
  .c1 { stroke: #2a78d6; } .f1 { fill: #2a78d6; }
  .c2 { stroke: #eb6834; } .f2 { fill: #eb6834; }
  .c3 { stroke: #1baf7a; } .f3 { fill: #1baf7a; }
  .line { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .title, .label { fill: #f0efec; }
    .sub, .axis-title { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .base, .cores { stroke: #383835; }
    .c1 { stroke: #3987e5; } .f1 { fill: #3987e5; }
    .c2 { stroke: #d95926; } .f2 { fill: #d95926; }
    .c3 { stroke: #199e70; } .f3 { fill: #199e70; }
    .dot { stroke: #1a1a19; }
  }
</style>
<rect class="surface" width="720" height="400" rx="8"/>
<text class="title" x="16" y="28">Час T(p)</text>
<text class="sub" x="16" y="48">Гістограма, reduction(+ : h[:256]); медіана з 5; Apple M4 (4P + 6E)</text>
<line class="c1 line" x1="16" y1="68" x2="34" y2="68"/>
<text class="sub" x="40" y="72">n = 10⁸</text>
